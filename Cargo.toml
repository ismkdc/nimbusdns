[workspace]
resolver = "3"
members = [
    "nimbus-core",
    "nimbus-api",
    "nimbus-web",
    "nimbus-bin",
]

[workspace.package]
version = "0.5.8"
edition = "2024"
license = "MIT"
authors = ["NimbusDNS contributors"]

[workspace.dependencies]
# -- Async runtime ------------------------------------------------------
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.34"

# -- DNS (hickory - formerly trust-dns) ---------------------------------
hickory-proto = "0.26.2"

# -- TLS / DoT ----------------------------------------------------------
rustls = "0.23.43"
tokio-rustls = "0.26.5"
rustls-native-certs = "0.8.4"

# -- HTTP / Web ---------------------------------------------------------
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip"] }

# -- Serialization ------------------------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"

# -- Database -----------------------------------------------------------
rusqlite = { version = "0.40.2", features = ["bundled", "vtab", "series"] }

# -- Logging / Observability --------------------------------------------
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "time"] }

# -- CLI ----------------------------------------------------------------
clap = { version = "4.6.6", features = ["derive", "env"] }

# -- System -------------------------------------------------------------
nix = { version = "0.31.3", features = ["fs", "signal", "net", "socket", "uio", "poll"] }
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
libc = "0.2.189"

# -- Error handling -----------------------------------------------------
thiserror = "2.0.20"
anyhow = "1.0.104"
# -- Time ---------------------------------------------------------------
chrono = { version = "0.4.45", features = ["serde"] }

# -- Cryptography / Auth ------------------------------------------------
sha2 = "0.11.0"
argon2 = { version = "0.6.0", features = ["getrandom"] }
password-hash = "0.6.1"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

# -- Data structures ----------------------------------------------------
dashmap = "6.2.1"
parking_lot = "0.12.5"
# -- Regex --------------------------------------------------------------
regex = "1.13.1"

# -- HTTP client (for StevenBlack hosts fetcher) ------------------------
# `rustls` is the only feature needed — it pulls rustls-platform-verifier for
# system CA roots. `rustls-native-certs` is NOT a feature in reqwest 0.13.
reqwest = { version = "0.13.4", features = ["rustls"] }

# -- Utilities ----------------------------------------------------------
hostname = "0.4.2"

# -- Networking ---------------------------------------------------------
bytes = "1.12.1"
socket2 = { version = "0.6.5", features = ["all"] }

# -- DHCP --------------------------------------------------------------
dhcproto = "0.15.0"
# atty = "0.2"  # deprecated, use std::io::IsTerminal

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
